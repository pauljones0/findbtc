# Sample CI gate: fail the build when findbtc finds secrets.
# Copy to .github/workflows/secrets-gate.yml.
#
# Pinned by tag; pin the digest for casework (see docs/CONTAINER.md).
# The sweep command is the same shape the pre-commit sample runs
# (samples/pre-commit), so both gates agree by construction.
name: secrets-gate
on: [push, pull_request]
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker run --rm -v ${{ github.workspace }}:/repo:ro
          ghcr.io/pauljones0/findbtc:latest
          -walk /repo -profile=secrets -fail-on-hit
