version: 2

project_name: findbtc

builds:
  # Split by OS so the nFPM packages below wrap only Linux binaries.
  # Archive names are unchanged (name_template uses .Os/.Arch).
  - id: findbtc
    main: .
    binary: findbtc
    goos:
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: findbtc-linux
    main: .
    binary: findbtc
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: 'findbtc_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# SPDX SBOM per archive, generated with syft (installed by release.yml).
sboms:
  - artifacts: archive

# Managed install path for labs: deb + rpm per Linux arch, built by the
# bundled nFPM (no rpmbuild/dpkg needed). Binary lands in /usr/bin.
nfpms:
  - id: findbtc
    package_name: findbtc
    ids:
      - findbtc-linux
    formats:
      - deb
      - rpm
    maintainer: Paul Jones <32859666+pauljones0@users.noreply.github.com>
    description: Find BTC wallets by scanning raw block devices
    homepage: https://github.com/pauljones0/findbtc
    license: GPL-3.0-or-later
    contents:
      - src: LICENSE
        dst: /usr/share/doc/findbtc/LICENSE
      - src: README.md
        dst: /usr/share/doc/findbtc/README.md

# The cask file is generated into dist/ but not pushed: the tap repo does
# not exist yet. Create an empty public repo named homebrew-findbtc under
# the release owner and flip skip_upload to publish it automatically.
homebrew_casks:
  - name: findbtc
    skip_upload: true
    repository:
      owner: pauljones0
      name: homebrew-findbtc
    homepage: https://github.com/pauljones0/findbtc
    description: Find BTC wallets by scanning raw block devices
    license: GPL-3.0-or-later
    binaries:
      - findbtc

snapshot:
  version_template: '{{ .Tag }}-SNAPSHOT-{{ .ShortCommit }}'
