version: 2

project_name: findbtc

builds:
  # Split by OS so the nFPM packages below wrap only Linux binaries.
  # Archive names are unchanged (name_template uses .Os/.Arch).
  - id: findbtc
    main: .
    binary: findbtc
    goos:
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
  - id: findbtc-linux
    main: .
    binary: findbtc
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env:
      # Static binaries: archives run anywhere and the scratch-based
      # container image has no dynamic loader. The module is pure Go
      # (stdlib + x/sys), so nothing needs cgo.
      - CGO_ENABLED=0

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: 'findbtc_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# SPDX SBOM per archive, generated with syft (installed by release.yml).
sboms:
  - artifacts: archive

# Managed install path for labs: deb + rpm per Linux arch, built by the
# bundled nFPM (no rpmbuild/dpkg needed). Binary lands in /usr/bin.
nfpms:
  - id: findbtc
    package_name: findbtc
    ids:
      - findbtc-linux
    formats:
      - deb
      - rpm
    maintainer: Paul Jones <32859666+pauljones0@users.noreply.github.com>
    description: Find BTC wallets by scanning raw block devices
    homepage: https://github.com/pauljones0/findbtc
    license: GPL-3.0-or-later
    contents:
      - src: LICENSE
        dst: /usr/share/doc/findbtc/LICENSE
      - src: README.md
        dst: /usr/share/doc/findbtc/README.md

# Blessed container image: scratch + the exact release binaries for
# linux/amd64 and linux/arm64, pushed to GHCR on tag. Snapshot builds
# produce per-platform local images (tag-arch suffix) instead of a
# pushed manifest; see docs/CONTAINER.md.
dockers_v2:
  - ids:
      - findbtc-linux
    images:
      - ghcr.io/pauljones0/findbtc
    tags:
      - "{{.Version}}"
      - latest
    extra_files:
      - LICENSE
      - README.md
    labels:
      org.opencontainers.image.title: findbtc
      org.opencontainers.image.description: Find BTC wallets by scanning raw block devices
      org.opencontainers.image.source: https://github.com/pauljones0/findbtc
      org.opencontainers.image.licenses: GPL-3.0-or-later
    annotations:
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.created: "{{.Date}}"

# Homebrew cask with a `binary` stanza (GoReleaser's blessed path for
# precompiled CLI tools; the binary-formula pipe is deprecated since
# v2.10). `brew install pauljones0/findbtc/findbtc` resolves the cask
# (proven by the macos install smoke in CI).
# skip_upload stays true until a TAP_GITHUB_TOKEN secret exists: the
# default GITHUB_TOKEN cannot push cross-repo, so tap automation
# needs a classic PAT with repo scope on homebrew-findbtc (see
# docs/RELEASE.md "Tap automation"). Until then the tap updates by
# hand from the packaging/homebrew bootstrap on each release.
homebrew_casks:
  - name: findbtc
    repository:
      owner: pauljones0
      name: homebrew-findbtc
    homepage: https://github.com/pauljones0/findbtc
    description: Find BTC wallets by scanning raw block devices
    license: GPL-3.0-or-later
    skip_upload: true
    binaries:
      - findbtc

# No scoops block: the Scoop bucket self-updates via the manifest's
# checkver/autoupdate plus its own scheduled checkver workflow (same
# repo, no extra token). See the bucket README.

# Winget manifests render into dist/ for review on every release but
# never auto-submit: microsoft/winget-pkgs PRs stay a manual,
# separately-authorized step (Goal 37). Install from the staged
# manifests today with `winget install --manifest <dir>`.
winget:
  - package_identifier: pauljones0.findbtc
    publisher: Paul Jones
    publisher_url: https://github.com/pauljones0
    homepage: https://github.com/pauljones0/findbtc
    short_description: Find BTC wallets by scanning raw block devices
    description: findbtc scans raw block devices and forensic images for cryptocurrency wallet traces.
    license: GPL-3.0-or-later
    license_url: https://github.com/pauljones0/findbtc/blob/master/LICENSE
    repository:
      owner: microsoft
      name: winget-pkgs
    skip_upload: true

snapshot:
  version_template: '{{ .Tag }}-SNAPSHOT-{{ .ShortCommit }}'
