name: install-smoke

# Every documented install path, executed for real on its own OS:
# Homebrew tap (macOS), Scoop bucket (Windows), winget manifests
# (Windows, local --manifest install until the community PR lands),
# plus pin/config drift checks on Ubuntu.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: packaging pins bind release checksums
        run: python3 scripts/verify-packaging-pins.py
      - name: pin verifier self-test (offline fixtures)
        run: python3 scripts/verify-packaging-pins.py --self-test
      - name: goreleaser config valid
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: snapshot deb/rpm carry completions, man, orphan docs
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,announce,sbom
      - name: install snapshot deb and prove the payload
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb | grep -i amd64 | head -1)
          test -n "$deb"
          test -n "$(ls dist/*.rpm)"
          dpkg-deb -c "$deb" | grep -E "usr/share/man/man1/findbtc.1|bash-completion/completions/findbtc|zsh/vendor-completions/_findbtc|zsh/site-functions/_findbtc|fish/vendor_completions.d/findbtc.fish|BENCHMARKS.md|PIPELINE_INGEST.md|RESOURCE_BOUNDS.md"
          sudo dpkg -i "$deb"
          test -f /usr/share/man/man1/findbtc.1
          test -f /usr/share/bash-completion/completions/findbtc
          test -f /usr/share/zsh/vendor-completions/_findbtc
          test -f /usr/share/zsh/site-functions/_findbtc
          test -f /usr/share/fish/vendor_completions.d/findbtc.fish
          test -f /usr/share/doc/findbtc/BENCHMARKS.md
          test -f /usr/share/doc/findbtc/PIPELINE_INGEST.md
          test -f /usr/share/doc/findbtc/RESOURCE_BOUNDS.md
          man -l /usr/share/man/man1/findbtc.1 | grep -q "SEE ALSO"
          bash -n /usr/share/bash-completion/completions/findbtc
          sudo apt-get update -q && sudo apt-get install -y -q zsh fish > /dev/null
          zsh -n /usr/share/zsh/vendor-completions/_findbtc
          fish --no-execute /usr/share/fish/vendor_completions.d/findbtc.fish

  brew-smoke:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: install from tap
        run: |
          brew tap pauljones0/findbtc
          brew install pauljones0/findbtc/findbtc
      - name: version matches latest release
        run: |
          tag="$(gh release view --json tagName -q .tagName -R pauljones0/findbtc)"
          findbtc -version | grep -q "${tag#v}"
      - name: synthetic scan
        run: |
          printf 'x wallet.dat y' > /tmp/fbt-smoke.bin
          findbtc -json /tmp/fbt-smoke.bin > /tmp/fbt-smoke.jsonl 2> /tmp/fbt-smoke.err
          grep -q wallet.dat /tmp/fbt-smoke.jsonl
          grep -q '\[COMPLETE\]' /tmp/fbt-smoke.err

  scoop-smoke:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: install scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm get.scoop.sh | iex
          # The installer updates User PATH, which later steps do not
          # inherit; export both bin dirs explicitly.
          "$env:USERPROFILE\scoop\shims" | Out-File -Append $env:GITHUB_PATH
          "$env:USERPROFILE\scoop\apps\scoop\current\bin" | Out-File -Append $env:GITHUB_PATH
      - name: install from bucket
        shell: pwsh
        run: |
          scoop bucket add findbtc https://github.com/pauljones0/scoop-findbtc
          scoop install findbtc
      - name: version matches latest release
        shell: pwsh
        run: |
          $tag = (gh release view --json tagName -q .tagName -R pauljones0/findbtc).Trim()
          (& scoop which findbtc) | Out-Null
          $out = & (scoop which findbtc) -version
          if ($out -notmatch $tag.TrimStart('v')) { throw "version '$out' lacks $tag" }
      - name: synthetic scan
        shell: pwsh
        run: |
          $exe = scoop which findbtc
          $smoke = Join-Path $env:TEMP 'fbt-smoke.bin'
          Set-Content -NoNewline -Path $smoke -Value 'x wallet.dat y'
          & $exe -json $smoke 2> $env:TEMP\fbt-smoke.err | Out-File $env:TEMP\fbt-smoke.jsonl
          if ((Get-Content $env:TEMP\fbt-smoke.jsonl -Raw) -notmatch 'wallet.dat') { throw 'no hit' }
          if ((Get-Content $env:TEMP\fbt-smoke.err -Raw) -notmatch '\[COMPLETE\]') { throw 'no COMPLETE' }

  winget-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: documented raw URLs fetch the same manifests
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/pauljones0/findbtc/${{ github.sha }}/packaging/winget"
          foreach ($f in @('pauljones0.findbtc.yaml', 'pauljones0.findbtc.installer.yaml', 'pauljones0.findbtc.locale.en-US.yaml')) {
            Invoke-WebRequest -Uri "$base/$f" -OutFile "$env:RUNNER_TEMP/$f"
            if ((Get-FileHash "$env:RUNNER_TEMP/$f").Hash -ne (Get-FileHash "packaging/winget/$f").Hash) { throw "$f differs from raw fetch" }
          }
      - name: validate manifests
        shell: pwsh
        run: winget validate --manifest packaging/winget
      - name: enable local-manifest installs
        shell: pwsh
        run: winget settings --enable LocalManifestFiles
      - name: install from local manifests
        shell: pwsh
        run: winget install --manifest packaging/winget --accept-package-agreements --accept-source-agreements
      - name: version and synthetic scan
        shell: pwsh
        run: |
          winget list --id pauljones0.findbtc | Out-Null
          $exe = (Get-Command findbtc -ErrorAction SilentlyContinue)?.Source
          if (-not $exe) {
            $exe = Get-ChildItem $env:LOCALAPPDATA\Microsoft\WinGet\Packages -Recurse -Filter findbtc.exe |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { throw 'findbtc not on PATH nor under WinGet Packages' }
          & $exe -version
          $smoke = Join-Path $env:TEMP 'fbt-smoke.bin'
          Set-Content -NoNewline -Path $smoke -Value 'x wallet.dat y'
          & $exe -json $smoke 2> $env:TEMP\fbt-wsmoke.err | Out-File $env:TEMP\fbt-wsmoke.jsonl
          if ((Get-Content $env:TEMP\fbt-wsmoke.jsonl -Raw) -notmatch 'wallet.dat') { throw 'no hit' }
          if ((Get-Content $env:TEMP\fbt-wsmoke.err -Raw) -notmatch '\[COMPLETE\]') { throw 'no COMPLETE' }
